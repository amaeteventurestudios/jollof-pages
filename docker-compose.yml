# Production stack: PocketBase and the web app, bound to localhost only. HTTPS comes from the
# host's Caddy, which the server shares with AuthorNX: copy deploy/jollofpages.caddy into
# /etc/caddy/sites/ (the main Caddyfile has `import /etc/caddy/sites/*`) and reload Caddy.
# Copy .env.example to .env and fill it in, then: docker compose up -d --build
services:
  pocketbase:
    build:
      context: .
      dockerfile: deploy/pocketbase.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8090"
    volumes:
      - pb_data:/pb/pb_data

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_POCKETBASE_URL: https://${PB_DOMAIN}
    restart: unless-stopped
    environment:
      POCKETBASE_INTERNAL_URL: http://pocketbase:8090
      NEXT_PUBLIC_POCKETBASE_URL: https://${PB_DOMAIN}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - pocketbase

volumes:
  pb_data:
