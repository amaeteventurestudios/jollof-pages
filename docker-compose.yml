# Production stack for one server (Hetzner, Contabo or Oracle): PocketBase, the web app and
# Caddy for HTTPS. Copy .env.example to .env and fill it in, then: docker compose up -d --build
services:
  pocketbase:
    build:
      context: .
      dockerfile: deploy/pocketbase.Dockerfile
    restart: unless-stopped
    volumes:
      - pb_data:/pb/pb_data

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_POCKETBASE_URL: https://${PB_DOMAIN}
    restart: unless-stopped
    environment:
      POCKETBASE_INTERNAL_URL: http://pocketbase:8090
      NEXT_PUBLIC_POCKETBASE_URL: https://${PB_DOMAIN}
    depends_on:
      - pocketbase

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      PB_DOMAIN: ${PB_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - pocketbase

volumes:
  pb_data:
  caddy_data:
  caddy_config:
